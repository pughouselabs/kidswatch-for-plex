{% extends "base.html" %}
{% block title %}Revoke invitation · KidsWatch for Plex{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block body %}
<section class="card">
  <div class="card-header"><h1>Revoke this invitation?</h1></div>
  <div class="card-body">
    <p>Anyone with this link will no longer be able to request access with it.</p>
    <form method="post" action="/admin/invites/{{ invite.id }}/revoke">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="form-actions"><button class="btn btn-danger">Revoke invitation</button><a class="btn" href="/admin/invites/{{ invite.id }}">Keep invitation</a></div>
    </form>
  </div>
</section>
{% endblock %}
