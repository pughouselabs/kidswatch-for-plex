    <ellipse cx="231" cy="232" rx="24" ry="30" fill="#263642" stroke="none"/>
    <circle cx="151" cy="230" r="7" fill="#FFF7E8" stroke="none"/>
    <circle cx="240" cy="230" r="7" fill="#FFF7E8" stroke="none"/>
    <path d="M150 277c0-23 20-38 43-38s45 15 45 38c0 25-19 42-44 42-26 0-44-17-44-42z" fill="#263642" stroke="none"/>
    <path d="m181 263 14 9 14-9m-14 9v15m-17 1q17 15 34 0" fill="none" stroke="#FFF7E8" stroke-width="7"/>
    <!-- A small, upright TV echoes the app's approved-viewing icon. -->
    <path d="m334 190 17 20 40-42" fill="none"/>
    <rect x="291" y="216" width="188" height="141" rx="25" fill="#E76A38"/>
