<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pug concept 1: Front-row friend</title>
  <desc id="desc">A round tan pug sits beside an orange television, looking toward its screen. The television antenna forms a check mark.</desc>
  <g stroke="#263642" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
