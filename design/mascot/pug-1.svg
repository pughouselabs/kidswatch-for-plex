    <path d="M111 307c-21 23-28 63-22 97h160c6-35-2-74-26-97" fill="#F0D3A1"/>
    <path d="M128 345v52m83-52v52" fill="none"/>
    <path d="M104 401c-20 0-26 24-8 24h51c18 0 18-24 0-24zm91 0c-18 0-18 24 0 24h48c19 0 14-24-6-24z" fill="#FFF7E8"/>
    <!-- A broad head, folded ears, and a compact muzzle read as a pug. -->
    <path d="M86 226c0-62 33-98 88-98 57 0 94 35 94 96v34c0 53-39 83-91 83-51 0-91-29-91-81z" fill="#F0D3A1"/>
    <path d="M98 151c-22-6-44 9-40 28l20 49c4 10 14 10 18-1l17-57c3-9-3-16-15-19zm143-3c22-3 43 12 37 32l-15 43c-4 12-15 12-19 0l-17-54c-3-11 2-19 14-21z" fill="#263642" stroke="none"/>
    <path d="M153 163q19-9 38 0" fill="none" stroke-width="8"/>
