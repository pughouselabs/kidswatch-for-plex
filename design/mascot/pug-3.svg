    <path d="M284 155q15-9 32-3" fill="none" stroke-width="8"/>
    <ellipse cx="299" cy="205" rx="24" ry="29" fill="#34313F" stroke="none"/>
    <circle cx="288" cy="203" r="7" fill="#FFF4DF" stroke="none"/>
    <path d="M276 229c-25 0-43 17-43 36s20 36 45 36h26c15 0 25-10 25-24 0-25-26-48-53-48z" fill="#34313F" stroke="none"/>
    <path d="m246 250 11 5-6 8m12 17q16 10 27-2" fill="none" stroke="#FFF4DF" stroke-width="7"/>
