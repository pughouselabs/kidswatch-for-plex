    <rect x="31" y="233" width="191" height="145" rx="24" fill="#8A6896"/>
    <rect x="51" y="254" width="151" height="102" rx="12" fill="#FFF4DF" stroke="none"/>
    <path d="m110 276 36 29-36 29z" fill="#8A6896" stroke="none"/>
    <path d="m62 381-8 20m136-20 8 20" fill="none"/>
    <!-- A curled tail and bent back leg make the seated pose explicit. -->
    <path d="M420 326c52-13 66 36 35 48-21 8-33-9-23-20" fill="none"/>
    <path d="M301 277h88c21 30 34 76 34 122v16H283c-6-45-2-99 18-138z" fill="#E9C795"/>
    <path d="M376 355c24 0 35 17 35 45m-102-55-7 59m37-57-2 57" fill="none"/>
