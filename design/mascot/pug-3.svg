<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pug concept 3: Little screen scout</title>
  <desc id="desc">A tall, blocky tan pug sits in profile on the right, looking left at a plum television with a check-mark antenna.</desc>
  <g stroke="#34313F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- A low TV balances the taller, upright sitting pug. -->
